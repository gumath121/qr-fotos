<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compartilhe esse momento</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');


* {
    box-sizing: border-box;
}


:root {
    --cor-evento: #c9a96e;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 15%,
            #3a3024 0%,
            #17130f 35%,
            #090807 75%
        );

    color: #f5eee3;

    font-family: 'Montserrat', sans-serif;

    display: flex;

    justify-content: center;
}


.container {

    width: 100%;

    max-width: 480px;

    min-height: 100vh;

    padding: 45px 24px 35px;

    display: flex;

    flex-direction: column;

    align-items: center;
}


.ornamento {

    color: var(--cor-evento);

    font-size: 22px;

    letter-spacing: 8px;

    margin-bottom: 20px;
}


h1 {

    font-family: 'Cormorant Garamond', serif;

    font-size: 43px;

    line-height: 1;

    font-weight: 500;

    text-align: center;

    margin: 0;
}


.subtitulo {

    text-align: center;

    color: #cfc5b6;

    font-size: 13px;

    line-height: 1.7;

    margin: 18px 10px 30px;
}


.linha {

    width: 55px;

    height: 1px;

    background: var(--cor-evento);

    margin: 25px 0 0;
}


/* =========================
   ESCOLHA FOTO / VÍDEO
========================= */

.escolha {

    width: 100%;

    display: flex;

    gap: 10px;

    margin-top: 8px;
}


.botao-escolha {

    flex: 1;

    margin-top: 0;

    padding: 16px 10px;

    background: rgba(255,255,255,.035);

    color: #e8dfd3;

    border: 1px solid rgba(201,169,110,.35);

    border-radius: 18px;

    font-size: 12px;

    letter-spacing: .5px;
}


.botao-escolha:hover {

    background: rgba(201,169,110,.08);

}


.botao-escolha.ativo {

    background: var(--cor-evento);

    color: #17130f;

    border-color: var(--cor-evento);
}


/* =========================
   CÂMERA
========================= */

.camera-box {

    width: 100%;

    overflow: hidden;

    border-radius: 22px;

    border: 1px solid rgba(201,169,110,.35);

    background: #050505;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);

    position: relative;

    display: none;
}


#camera {

    width: 100%;

    display: block;

    aspect-ratio: 3 / 4;

    object-fit: cover;

    background: #000;
}


#fotoTirada {

    width: 100%;

    display: none;

    aspect-ratio: 3 / 4;

    object-fit: cover;
}


#videoPreview {

    width: 100%;

    display: none;

    aspect-ratio: 3 / 4;

    object-fit: cover;

    background: #000;
}


canvas {

    display: none;
}


/* =========================
   CONTADOR DO VÍDEO
========================= */

#contadorVideo {

    position: absolute;

    top: 14px;

    left: 50%;

    transform: translateX(-50%);

    padding: 8px 14px;

    border-radius: 30px;

    background: rgba(0,0,0,.7);

    border: 1px solid rgba(255,255,255,.25);

    color: #fff;

    font-size: 12px;

    z-index: 20;

    display: none;

    backdrop-filter: blur(8px);
}


#contadorVideo.gravando {

    color: #ffb0b0;

}


/* =========================
   BOTÃO TROCAR CÂMERA
========================= */

#trocar {

    position: absolute;

    right: 14px;

    bottom: 14px;

    width: auto;

    margin: 0;

    padding: 11px 15px;

    border-radius: 50px;

    background: rgba(0,0,0,.65);

    color: white;

    border: 1px solid rgba(255,255,255,.35);

    backdrop-filter: blur(8px);

    font-size: 12px;

    z-index: 10;

    display: none;
}


/* =========================
   BOTÕES
========================= */

button {

    width: 100%;

    border: none;

    border-radius: 50px;

    padding: 17px 20px;

    margin-top: 16px;

    font-family: 'Montserrat', sans-serif;

    font-size: 13px;

    font-weight: 600;

    letter-spacing: 1px;

    cursor: pointer;

    transition: .2s;
}


button:active {

    transform: scale(.98);
}


button:disabled {

    opacity: .55;

    cursor: default;

}


/* ABRIR CÂMERA */

#abrir {

    background: var(--cor-evento);

    color: #17130f;
}


/* TIRAR FOTO */

#tirar {

    background: var(--cor-evento);

    color: #17130f;

    display: none;
}


/* INICIAR VÍDEO */

#gravar {

    background: var(--cor-evento);

    color: #17130f;

    display: none;
}


/* ENVIAR FOTO */

#enviar {

    background: var(--cor-evento);

    color: #17130f;

    display: none;
}


/* ENVIAR VÍDEO */

#enviarVideo {

    background: var(--cor-evento);

    color: #17130f;

    display: none;
}


/* TIRAR OUTRA */

#outra {

    background: transparent;

    color: #d9d0c3;

    border: 1px solid rgba(255,255,255,.2);

    display: none;
}


/* GRAVAR NOVAMENTE */

#novoVideo {

    background: transparent;

    color: #d9d0c3;

    border: 1px solid rgba(255,255,255,.2);

    display: none;
}


/* VER ÁLBUM */

#album {

    background: transparent;

    color: var(--cor-evento);

    border: 1px solid rgba(201,169,110,.5);

    display: none;
}


/* =========================
   STATUS
========================= */

#status {

    margin-top: 22px;

    min-height: 45px;

    text-align: center;

    font-size: 12px;

    color: #cfc5b6;

    transition: .3s;
}


/* =========================
   RODAPÉ
========================= */

.rodape {

    margin-top: auto;

    padding-top: 35px;

    font-family: 'Cormorant Garamond', serif;

    font-size: 18px;

    color: #a99d8c;
}


.desenvolvido {

    margin-top: 10px;

    font-family: 'Montserrat', sans-serif;

    font-size: 9px;

    letter-spacing: 1px;

    color: #756d62;

    opacity: .75;
}


iframe {

    display: none;
}

</style>

</head>


<body>


<div class="container">


    <div class="ornamento">
        ✦
    </div>


    <h1 id="tituloEvento">

        Compartilhe<br>

        esse momento

    </h1>


    <div class="linha"></div>


    <p class="subtitulo" id="mensagemEvento">

        Registre um momento especial e<br>

        faça parte das nossas memórias. ❤️

    </p>


    <!-- =========================
         ESCOLHA
    ========================== -->

    <div class="escolha">

        <button
            class="botao-escolha ativo"
            id="modoFoto">

            📷 &nbsp; FOTO

        </button>


        <button
            class="botao-escolha"
            id="modoVideo">

            🎥 &nbsp; RECADO

        </button>

    </div>


    <!-- =========================
         CÂMERA
    ========================== -->

    <div class="camera-box">


        <!-- CÂMERA AO VIVO -->

        <video
            id="camera"
            autoplay
            playsinline>
        </video>


        <!-- FOTO CAPTURADA -->

        <img
            id="fotoTirada">


        <!-- VÍDEO GRAVADO -->

        <video
            id="videoPreview"
            controls
            playsinline>
        </video>


        <!-- CONTADOR -->

        <div id="contadorVideo">
            00:30
        </div>


        <!-- TROCAR CÂMERA -->

        <button id="trocar">

            ↻ &nbsp; Trocar câmera

        </button>


    </div>


    <canvas id="canvas"></canvas>


    <!-- =========================
         ABRIR CÂMERA
    ========================== -->

    <button id="abrir">

        📷 &nbsp; ABRIR CÂMERA

    </button>


    <!-- =========================
         TIRAR FOTO
    ========================== -->

    <button id="tirar">

        ✦ &nbsp; TIRAR FOTO

    </button>


    <!-- =========================
         GRAVAR VÍDEO
    ========================== -->

    <button id="gravar">

        ● &nbsp; GRAVAR RECADO

    </button>


    <!-- =========================
         ENVIAR FOTO
    ========================== -->

    <button id="enviar">

        ♥ &nbsp; COMPARTILHAR FOTO

    </button>


    <!-- =========================
         ENVIAR VÍDEO
    ========================== -->

    <button id="enviarVideo">

        🎥 &nbsp; ENVIAR RECADO

    </button>


    <!-- =========================
         OUTRA FOTO
    ========================== -->

    <button id="outra">

        ↻ &nbsp; TIRAR OUTRA

    </button>


    <!-- =========================
         NOVO VÍDEO
    ========================== -->

    <button id="novoVideo">

        ↻ &nbsp; GRAVAR NOVAMENTE

    </button>


    <!-- =========================
         ÁLBUM
    ========================== -->

    <button id="album">

        ♥ &nbsp; VER ÁLBUM

    </button>


    <div id="status"></div>


    <div class="rodape">

        Feito para guardar momentos.

        <div class="desenvolvido">

            Desenvolvido por Gustavo M.

        </div>

    </div>


</div>



<!-- =====================================================
     FORMULÁRIO DE ENVIO
===================================================== -->

<form

    id="formulario"

    action="https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sRZ8tb-pVqp5glsh8hWzKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec"

    method="POST"

    target="resposta">


    <input
        type="hidden"
        name="foto"
        id="foto">


    <input
        type="hidden"
        name="nomeArquivo"
        id="nomeArquivo">


    <input
        type="hidden"
        name="evento"
        id="evento">


    <!-- TIPO DO ARQUIVO -->

    <input
        type="hidden"
        name="tipo"
        id="tipo"
        value="foto">


</form>


<iframe
    name="resposta"
    id="resposta">
</iframe>



<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

let stream = null;

let cameraAtual = "environment";

let modoAtual = "foto";

let mediaRecorder = null;

let chunksVideo = [];

let videoBlob = null;

let contadorInterval = null;

let segundosRestantes = 30;


/* =====================================================
   API
===================================================== */

const API_EVENTOS =
"https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sRZ8tb-pVqp5glsh8hWzKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec";


/* =====================================================
   EVENTO
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const evento =
    parametros.get("evento") ||
    "teste";


/* =====================================================
   ELEMENTOS
===================================================== */

const abrir =
    document.getElementById("abrir");


const camera =
    document.getElementById("camera");


const trocar =
    document.getElementById("trocar");


const tirar =
    document.getElementById("tirar");


const gravar =
    document.getElementById("gravar");


const enviar =
    document.getElementById("enviar");


const enviarVideo =
    document.getElementById("enviarVideo");


const outra =
    document.getElementById("outra");


const novoVideo =
    document.getElementById("novoVideo");


const album =
    document.getElementById("album");


const fotoTirada =
    document.getElementById("fotoTirada");


const videoPreview =
    document.getElementById("videoPreview");


const contadorVideo =
    document.getElementById("contadorVideo");


const status =
    document.getElementById("status");


const modoFoto =
    document.getElementById("modoFoto");


const modoVideo =
    document.getElementById("modoVideo");


const cameraBox =
    document.querySelector(".camera-box");


/* =====================================================
   FORMULÁRIO
===================================================== */

const formulario =
    document.getElementById("formulario");


const campoFoto =
    document.getElementById("foto");


const campoNome =
    document.getElementById("nomeArquivo");


const campoEvento =
    document.getElementById("evento");


const campoTipo =
    document.getElementById("tipo");


campoEvento.value =
    evento;


/* =====================================================
   PARA CÂMERA
===================================================== */

function pararCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }

}


/* =====================================================
   ABRIR CÂMERA
===================================================== */

async function abrirCamera() {

    try {

        pararCamera();


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: cameraAtual,

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 1280
                    }

                },

                audio: modoAtual === "video"

            });


        camera.srcObject =
            stream;


        camera.style.display =
            "block";


        fotoTirada.style.display =
            "none";


        videoPreview.style.display =
            "none";


        cameraBox.style.display =
            "block";


        abrir.style.display =
            "none";


        trocar.style.display =
            "block";


        album.style.display =
            "none";


        if (modoAtual === "foto") {

            tirar.style.display =
                "block";

            gravar.style.display =
                "none";

            status.innerText =
                cameraAtual === "user"
                    ? "🤳 Câmera frontal"
                    : "📷 Câmera traseira";

        }

        else {

            tirar.style.display =
                "none";

            gravar.style.display =
                "block";

            status.innerText =
                "🎥 Pronto para gravar seu recado";

        }

    }

    catch (erro) {

        console.error(erro);

        status.innerText =
            "Não foi possível acessar a câmera e o microfone.";

    }

}


/* =====================================================
   MODO FOTO
===================================================== */

modoFoto.addEventListener(
    "click",
    async () => {

        if (mediaRecorder &&
            mediaRecorder.state === "recording") {

            return;

        }

        modoAtual =
            "foto";


        modoFoto.classList.add("ativo");

        modoVideo.classList.remove("ativo");


        resetarInterface();


        abrir.style.display =
            "block";


        status.innerText =
            "Escolha abrir a câmera para tirar uma foto.";

    }
);


/* =====================================================
   MODO VÍDEO
===================================================== */

modoVideo.addEventListener(
    "click",
    async () => {

        if (mediaRecorder &&
            mediaRecorder.state === "recording") {

            return;

        }

        modoAtual =
            "video";


        modoVideo.classList.add("ativo");

        modoFoto.classList.remove("ativo");


        resetarInterface();


        abrir.style.display =
            "block";


        status.innerText =
            "Grave um recado de até 30 segundos. ❤️";

    }
);


/* =====================================================
   BOTÃO ABRIR
===================================================== */

abrir.addEventListener(
    "click",
    async () => {

        await abrirCamera();

    }
);


/* =====================================================
   TROCAR CÂMERA
===================================================== */

trocar.addEventListener(
    "click",
    async () => {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {

            return;

        }


        cameraAtual =

            cameraAtual === "environment"

            ? "user"

            : "environment";


        await abrirCamera();

    }
);


/* =====================================================
   TIRAR FOTO
===================================================== */

tirar.addEventListener(
    "click",
    () => {

        let largura =
            camera.videoWidth;


        let altura =
            camera.videoHeight;


        const larguraMaxima =
            1600;


        if (
            largura >
            larguraMaxima
        ) {

            const proporcao =
                larguraMaxima /
                largura;


            largura =
                larguraMaxima;


            altura =
                altura *
                proporcao;

        }


        canvas.width =
            largura;


        canvas.height =
            altura;


        const contexto =
            canvas.getContext("2d");


        contexto.drawImage(

            camera,

            0,
            0,

            largura,
            altura

        );


        const fotoBase64 =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        fotoTirada.src =
            fotoBase64;


        fotoTirada.style.display =
            "block";


        camera.style.display =
            "none";


        pararCamera();


        tirar.style.display =
            "none";


        trocar.style.display =
            "none";


        enviar.style.display =
            "block";


        outra.style.display =
            "block";


        album.style.display =
            "none";


        status.innerText =
            "Sua foto está pronta ♥";

    }
);


/* =====================================================
   ENVIAR FOTO
===================================================== */

enviar.addEventListener(
    "click",
    () => {

        const fotoBase64 =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        const base64 =
            fotoBase64.split(",")[1];


        campoFoto.value =
            base64;


        campoNome.value =
            "foto_" +
            Date.now() +
            ".jpg";


        campoTipo.value =
            "foto";


        campoEvento.value =
            evento;


        status.innerHTML = `

            <div style="
                font-family:'Cormorant Garamond',serif;
                font-size:25px;
                color:var(--cor-evento);
                margin-bottom:8px;
            ">

                Foto compartilhada ♥

            </div>

            <div style="
                font-family:'Montserrat',sans-serif;
                font-size:12px;
                line-height:1.7;
                color:#cfc5b6;
            ">

                Obrigado por fazer parte<br>
                desse momento especial.

            </div>

        `;


        enviar.innerHTML =
            "✓ &nbsp; FOTO COMPARTILHADA";


        enviar.disabled =
            true;


        formulario.submit();


        setTimeout(
            () => {

                enviar.style.display =
                    "none";


                outra.style.display =
                    "block";


                album.style.display =
                    "block";


                outra.innerHTML =
                    "📷 &nbsp; TIRAR OUTRA FOTO";


                enviar.disabled =
                    false;

            },
            3000
        );

    }
);


/* =====================================================
   INICIAR GRAVAÇÃO
===================================================== */

gravar.addEventListener(
    "click",
    () => {

        if (!stream) {

            status.innerText =
                "Abra a câmera primeiro.";

            return;

        }


        chunksVideo = [];

        videoBlob = null;


        let mimeType =
            "";


        if (
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp9,opus"
            )
        ) {

            mimeType =
                "video/webm;codecs=vp9,opus";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "video/webm;codecs=vp8,opus"
            )
        ) {

            mimeType =
                "video/webm;codecs=vp8,opus";

        }

        else {

            mimeType =
                "video/webm";

        }


        try {

            mediaRecorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType: mimeType
                    }
                );

        }

        catch (erro) {

            console.error(erro);

            status.innerText =
                "Este aparelho não permite gravar vídeo neste navegador.";

            return;

        }


        mediaRecorder.ondataavailable =
            function(event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    chunksVideo.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            function() {

                videoBlob =
                    new Blob(
                        chunksVideo,
                        {
                            type:
                                mimeType
                        }
                    );


                const videoURL =
                    URL.createObjectURL(
                        videoBlob
                    );


                videoPreview.src =
                    videoURL;


                camera.style.display =
                    "none";


                videoPreview.style.display =
                    "block";


                contadorVideo.style.display =
                    "none";


                trocar.style.display =
                    "none";


                gravar.style.display =
                    "none";


                enviarVideo.style.display =
                    "block";


                novoVideo.style.display =
                    "block";


                status.innerText =
                    "Seu recado está pronto ❤️";


                pararCamera();

            };


        mediaRecorder.start();


        segundosRestantes =
            30;


        contadorVideo.innerText =
            "00:30";


        contadorVideo.classList.add(
            "gravando"
        );


        contadorVideo.style.display =
            "block";


        gravar.innerHTML =
            "■ &nbsp; PARAR GRAVAÇÃO";


        status.innerText =
            "Gravando seu recado...";


        contadorInterval =
            setInterval(
                () => {

                    segundosRestantes--;


                    const segundos =
                        String(
                            segundosRestantes
                        ).padStart(
                            2,
                            "0"
                        );


                    contadorVideo.innerText =
                        "00:" +
                        segundos;


                    if (
                        segundosRestantes <= 0
                    ) {

                        pararGravacao();

                    }

                },
                1000
            );

    }
);


/* =====================================================
   PARAR GRAVAÇÃO
===================================================== */

function pararGravacao() {

    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {

        mediaRecorder.stop();

    }


    if (contadorInterval) {

        clearInterval(
            contadorInterval
        );

        contadorInterval =
            null;

    }


    contadorVideo.classList.remove(
        "gravando"
    );

}


/* =====================================================
   BOTÃO PARAR / GRAVAR
===================================================== */

gravar.addEventListener(
    "click",
    () => {

        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {

            pararGravacao();

        }

    }
);


/* =====================================================
   ENVIAR VÍDEO
===================================================== */

enviarVideo.addEventListener(
    "click",
    async () => {

        if (!videoBlob) {

            status.innerText =
                "Nenhum vídeo foi gravado.";

            return;

        }


        enviarVideo.disabled =
            true;


        enviarVideo.innerHTML =
            "⏳ &nbsp; PREPARANDO RECADO...";


        try {

            const base64 =
                await blobParaBase64(
                    videoBlob
                );


            campoFoto.value =
                base64;


            campoNome.value =
                "recado_" +
                Date.now() +
                ".webm";


            campoTipo.value =
                "video";


            campoEvento.value =
                evento;


            status.innerHTML = `

                <div style="
                    font-family:'Cormorant Garamond',serif;
                    font-size:25px;
                    color:var(--cor-evento);
                    margin-bottom:8px;
                ">

                    Recado enviado ♥

                </div>

                <div style="
                    font-family:'Montserrat',sans-serif;
                    font-size:12px;
                    line-height:1.7;
                    color:#cfc5b6;
                ">

                    Obrigado por deixar<br>
                    uma lembrança especial.

                </div>

            `;


            enviarVideo.innerHTML =
                "✓ &nbsp; RECADO ENVIADO";


            formulario.submit();


            setTimeout(
                () => {

                    enviarVideo.style.display =
                        "none";


                    novoVideo.style.display =
                        "block";


                    album.style.display =
                        "block";


                    enviarVideo.disabled =
                        false;

                },
                3000
            );

        }

        catch (erro) {

            console.error(erro);

            status.innerText =
                "Não foi possível preparar o vídeo.";

            enviarVideo.disabled =
                false;

            enviarVideo.innerHTML =
                "🎥 &nbsp; ENVIAR RECADO";

        }

    }
);


/* =====================================================
   BLOB → BASE64
===================================================== */

function blobParaBase64(blob) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onloadend =
                function() {

                    const resultado =
                        reader.result;


                    resolve(
                        resultado.split(",")[1]
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );

}

/* =====================================================
   CONFIGURAÇÃO DO EVENTO
===================================================== */

function carregarEvento() {

    const callback =
        "evento_" +
        Date.now();


    window[callback] =
        function(config) {

            delete window[callback];


            if (
                !config ||
                config.erro
            ) {

                console.log(
                    "Evento não encontrado."
                );

                return;

            }


            const titulo =
                document.getElementById(
                    "tituloEvento"
                );


            if (titulo) {

                titulo.innerHTML =
                    config.nome;

            }


            const mensagem =
                document.getElementById(
                    "mensagemEvento"
                );


            if (mensagem) {

                mensagem.innerHTML =
                    config.mensagem;

            }


            if (config.cor) {

                document.documentElement
                    .style.setProperty(
                        "--cor-evento",
                        config.cor
                    );

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_EVENTOS +
        "?evento=" +
        encodeURIComponent(evento) +
        "&config=true" +
        "&callback=" +
        callback;


    document.body.appendChild(
        script
    );

}


/* =====================================================
   CARREGA EVENTO
===================================================== */

carregarEvento();
