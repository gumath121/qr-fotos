<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compartilhe sua foto</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 500px;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

p {
    color: #bbb;
    margin-bottom: 25px;
}

video,
#fotoTirada {
    width: 100%;
    border-radius: 20px;
    background: #000;
}

#fotoTirada {
    display: none;
}

canvas {
    display: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#abrir {
    background: white;
    color: #111;
}

#tirar {
    background: #ff3366;
    color: white;
    display: none;
}

#enviar {
    background: #22c55e;
    color: white;
    display: none;
}

#outra {
    background: #333;
    color: white;
    display: none;
}

#status {
    margin-top: 20px;
    font-size: 15px;
    color: #aaa;
}

iframe {
    display: none;
}

</style>
</head>

<body>

<div class="container">

    <h1>📸 Compartilhe sua foto</h1>

    <p>
        Registre esse momento e compartilhe com os noivos! ❤️
    </p>

    <button id="abrir">
        📷 ABRIR CÂMERA
    </button>

    <video id="camera" autoplay playsinline></video>

    <img id="fotoTirada">

    <canvas id="canvas"></canvas>

    <button id="tirar">
        📸 TIRAR FOTO
    </button>

    <button id="enviar">
        ❤️ ENVIAR FOTO
    </button>

    <button id="outra">
        🔄 TIRAR OUTRA
    </button>

    <div id="status"></div>

</div>


<!-- FORMULÁRIO INVISÍVEL PARA ENVIAR AO GOOGLE -->

<form
    id="formulario"
    action="https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sZr8tb-pVqp5glsh8hWzKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec"
    method="POST"
    target="resposta">

    <input type="hidden" name="foto" id="foto">

    <input type="hidden" name="nomeArquivo" id="nomeArquivo">

</form>

<iframe name="resposta" id="resposta"></iframe>


<script>

let stream = null;

const abrir = document.getElementById("abrir");
const camera = document.getElementById("camera");
const tirar = document.getElementById("tirar");
const enviar = document.getElementById("enviar");
const outra = document.getElementById("outra");
const fotoTirada = document.getElementById("fotoTirada");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

const formulario = document.getElementById("formulario");
const campoFoto = document.getElementById("foto");
const campoNome = document.getElementById("nomeArquivo");


// ABRIR CÂMERA

abrir.addEventListener("click", async () => {

    try {

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: {
                    ideal: "environment"
                }
            },

            audio: false

        });

        camera.srcObject = stream;

        camera.style.display = "block";

        abrir.style.display = "none";

        tirar.style.display = "block";

        status.innerText = "Câmera ativada! 📸";

    }

    catch (erro) {

        status.innerText =
            "Não conseguimos acessar a câmera. Verifique a permissão do navegador.";

        console.error(erro);

    }

});


// TIRAR FOTO

tirar.addEventListener("click", () => {

    let largura = camera.videoWidth;
    let altura = camera.videoHeight;

    const larguraMaxima = 1600;

    if (largura > larguraMaxima) {

        const proporcao = larguraMaxima / largura;

        largura = larguraMaxima;
        altura = altura * proporcao;

    }

    canvas.width = largura;
    canvas.height = altura;

    const contexto = canvas.getContext("2d");

    contexto.drawImage(
        camera,
        0,
        0,
        largura,
        altura
    );


    // COMPRIME A FOTO

    const fotoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.75
    );


    // MOSTRA A FOTO

    fotoTirada.src = fotoBase64;

    fotoTirada.style.display = "block";

    camera.style.display = "none";

    tirar.style.display = "none";

    enviar.style.display = "block";

    outra.style.display = "block";

    status.innerText = "Foto pronta! ❤️";

});


// ENVIAR FOTO

enviar.addEventListener("click", () => {

    const fotoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.75
    );


    // Remove o começo "data:image/jpeg;base64,"

    const base64 = fotoBase64.split(",")[1];


    campoFoto.value = base64;

    campoNome.value =
        "foto_" +
        Date.now() +
        ".jpg";


    status.innerText =
        "Enviando foto... ⏳";

    enviar.disabled = true;


    formulario.submit();


    setTimeout(() => {

        status.innerText =
            "✅ Foto enviada! Obrigado por participar! ❤️";

        enviar.disabled = false;

    }, 2500);

});


// TIRAR OUTRA

outra.addEventListener("click", () => {

    fotoTirada.style.display = "none";

    camera.style.display = "block";

    enviar.style.display = "none";

    outra.style.display = "none";

    tirar.style.display = "block";

    status.innerText =
        "Pode tirar outra foto 📸";

});

</script>

</body>
</html>
