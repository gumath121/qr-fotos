<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compartilhe esse momento</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 15%, #3a3024 0%, #17130f 35%, #090807 75%);
    color: #f5eee3;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 45px 24px 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.ornamento {
    color: #c9a96e;
    font-size: 22px;
    letter-spacing: 8px;
    margin-bottom: 20px;
}

h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 43px;
    line-height: 1;
    font-weight: 500;
    text-align: center;
    margin: 0;
    letter-spacing: -0.5px;
}

.subtitulo {
    text-align: center;
    color: #cfc5b6;
    font-size: 13px;
    line-height: 1.7;
    margin: 18px 10px 30px;
}

.linha {
    width: 55px;
    height: 1px;
    background: #c9a96e;
    margin-bottom: 30px;
}

.camera-box {
    width: 100%;
    overflow: hidden;
    border-radius: 22px;
    border: 1px solid rgba(201,169,110,.35);
    background: #050505;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

video,
#fotoTirada {
    width: 100%;
    display: block;
}

#fotoTirada {
    display: none;
}

canvas {
    display: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 50px;
    padding: 17px 20px;
    margin-top: 16px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .2s;
}

button:active {
    transform: scale(.98);
}

#abrir {
    background: #c9a96e;
    color: #17130f;
}

#tirar {
    background: #c9a96e;
    color: #17130f;
    display: none;
}

#enviar {
    background: #c9a96e;
    color: #17130f;
    display: none;
}

#outra {
    background: transparent;
    color: #d9d0c3;
    border: 1px solid rgba(255,255,255,.2);
    display: none;
}

#status {
    margin-top: 18px;
    min-height: 20px;
    text-align: center;
    font-size: 12px;
    color: #cfc5b6;
}

.rodape {
    margin-top: auto;
    padding-top: 35px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: #a99d8c;
}

iframe {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="ornamento">✦</div>

    <h1>Compartilhe<br>esse momento</h1>

    <div class="linha"></div>

    <p class="subtitulo">
        Registre um momento especial e<br>
        faça parte das nossas memórias. ❤️
    </p>

    <div class="camera-box">

        <video id="camera" autoplay playsinline></video>

        <img id="fotoTirada">

    </div>

    <canvas id="canvas"></canvas>

    <button id="abrir">
        📷 &nbsp; ABRIR CÂMERA
    </button>

    <button id="tirar">
        ✦ &nbsp; TIRAR FOTO
    </button>

    <button id="enviar">
        ♥ &nbsp; COMPARTILHAR FOTO
    </button>

    <button id="outra">
        ↻ &nbsp; TIRAR OUTRA
    </button>

    <div id="status"></div>

    <div class="rodape">
        Feito para guardar momentos.
    </div>

</div>


<form
    id="formulario"
    action="https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sZr8tb-pVqp5glsh8hWzKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec"
    method="POST"
    target="resposta">

    <input type="hidden" name="foto" id="foto">

    <input type="hidden" name="nomeArquivo" id="nomeArquivo">

</form>

<iframe name="resposta" id="resposta"></iframe>


<script>

let stream = null;

const abrir = document.getElementById("abrir");
const camera = document.getElementById("camera");
const tirar = document.getElementById("tirar");
const enviar = document.getElementById("enviar");
const outra = document.getElementById("outra");
const fotoTirada = document.getElementById("fotoTirada");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

const formulario = document.getElementById("formulario");
const campoFoto = document.getElementById("foto");
const campoNome = document.getElementById("nomeArquivo");


abrir.addEventListener("click", async () => {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        camera.srcObject = stream;

        camera.style.display = "block";
        abrir.style.display = "none";
        tirar.style.display = "block";

        status.innerText = "Câmera ativada";

    } catch (erro) {

        status.innerText =
            "Não foi possível acessar a câmera.";

        console.error(erro);
    }

});


tirar.addEventListener("click", () => {

    let largura = camera.videoWidth;
    let altura = camera.videoHeight;

    const larguraMaxima = 1600;

    if (largura > larguraMaxima) {

        const proporcao = larguraMaxima / largura;

        largura = larguraMaxima;
        altura = altura * proporcao;
    }

    canvas.width = largura;
    canvas.height = altura;

    const contexto = canvas.getContext("2d");

    contexto.drawImage(
        camera,
        0,
        0,
        largura,
        altura
    );

    const fotoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.75
    );

    fotoTirada.src = fotoBase64;

    fotoTirada.style.display = "block";
    camera.style.display = "none";

    tirar.style.display = "none";
    enviar.style.display = "block";
    outra.style.display = "block";

    status.innerText = "Sua foto está pronta ♥";

});


enviar.addEventListener("click", () => {

    const fotoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.75
    );

    const base64 = fotoBase64.split(",")[1];

    campoFoto.value = base64;

    campoNome.value =
        "foto_" + Date.now() + ".jpg";

    status.innerText =
        "Compartilhando sua foto...";

    enviar.disabled = true;

    formulario.submit();

    setTimeout(() => {

        status.innerText =
            "♥ Foto compartilhada com sucesso!";

        enviar.disabled = false;

    }, 2500);

});


outra.addEventListener("click", () => {

    fotoTirada.style.display = "none";

    camera.style.display = "block";

    enviar.style.display = "none";
    outra.style.display = "none";

    tirar.style.display = "block";

    status.innerText =
        "Pronto para outra foto 📷";

});

</script>

</body>
</html>
