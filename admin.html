<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administração — QR Fotos</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: #f5f0e8;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px 60px;
}

h1 {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 42px;
    margin: 0 0 8px;
    color: #d8b878;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 40px;
}

/* =========================
   CRIAR EVENTO
========================= */

.card {
    background: #121212;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 30px;
}

.card h2 {
    margin-top: 0;
    color: #d8b878;
    font-family: Georgia, serif;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    color: #ccc;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #090909;
    color: white;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

input[type="color"] {
    height: 45px;
    padding: 4px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
    opacity: .9;
}

.btn-primary {
    background: #d8b878;
    color: #111;
    width: 100%;
    margin-top: 22px;
    font-size: 15px;
}

/* =========================
   EVENTOS
========================= */

.event-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.event-card {
    background: #121212;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 22px;
    position: relative;
}

.event-title {
    font-family: Georgia, serif;
    font-size: 25px;
    color: #d8b878;
    margin-bottom: 5px;
}

.event-id {
    font-size: 13px;
    color: #777;
    margin-bottom: 18px;
}

.event-type {
    display: inline-block;
    background: #242424;
    color: #ccc;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 12px;
    margin-bottom: 15px;
}

.photo-count {
    font-size: 16px;
    margin: 12px 0 20px;
    color: #ddd;
}

.photo-count strong {
    color: #d8b878;
    font-size: 22px;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.actions button {
    width: 100%;
}

.btn-event {
    background: #d8b878;
    color: #111;
}

.btn-album {
    background: #252525;
    color: #fff;
    border: 1px solid #444;
}

.btn-qr {
    grid-column: span 2;
    background: #181818;
    color: #d8b878;
    border: 1px solid #d8b878;
}

.qr-area {
    display: none;
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #292929;
}

.qr-area img {
    background: white;
    padding: 10px;
    border-radius: 8px;
    max-width: 220px;
}

.qr-link {
    word-break: break-all;
    color: #999;
    font-size: 12px;
    margin-top: 12px;
}

.loading {
    text-align: center;
    color: #888;
    padding: 30px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px;
}

/* =========================
   RESULTADO
========================= */

#resultado {
    display: none;
    margin-bottom: 30px;
    background: #151515;
    border: 1px solid #d8b878;
    border-radius: 12px;
    padding: 20px;
}

#resultado h3 {
    margin-top: 0;
    color: #d8b878;
}

.result-link {
    word-break: break-all;
    color: #aaa;
    margin: 8px 0;
}

.result-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

@media(max-width:600px) {

    h1 {
        font-size: 32px;
    }

    .container {
        padding: 25px 15px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .btn-qr {
        grid-column: span 1;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>QR FOTOS</h1>

<div class="subtitle">
Painel de administração de eventos
</div>


<!-- =========================
     CRIAR EVENTO
========================= -->

<div class="card">

<h2>Novo evento</h2>

<label>Nome do evento</label>
<input
    type="text"
    id="nome"
    placeholder="Ex.: Casamento Gustavo e Ana"
>

<label>ID do evento</label>
<input
    type="text"
    id="id"
    placeholder="Ex.: casamento-gustavo"
>

<label>Tipo do evento</label>

<select id="tipo">

<option value="Casamento">Casamento</option>
<option value="Aniversário">Aniversário</option>
<option value="Empresa">Evento Corporativo</option>
<option value="Formatura">Formatura</option>
<option value="Festa">Festa</option>
<option value="Outro">Outro</option>

</select>

<label>Mensagem</label>

<textarea
    id="mensagem"
    placeholder="Ex.: Compartilhe as fotos desse momento especial!"
></textarea>

<label>Cor do evento</label>

<input
    type="color"
    id="cor"
    value="#d8b878"
>

<button
    class="btn-primary"
    onclick="criarEvento()"
>
CRIAR EVENTO
</button>

</div>


<!-- =========================
     RESULTADO
========================= -->

<div id="resultado">

<h3>Evento criado com sucesso!</h3>

<div id="resultadoNome"></div>

<div class="result-link" id="resultadoEvento"></div>

<div class="result-link" id="resultadoAlbum"></div>

<div class="result-buttons">

<button
    class="btn-event"
    onclick="abrirResultadoEvento()"
>
ABRIR EVENTO
</button>

<button
    class="btn-album"
    onclick="abrirResultadoAlbum()"
>
ABRIR ÁLBUM
</button>

<button
    class="btn-qr"
    onclick="abrirResultadoQR()"
>
GERAR QR CODE
</button>

</div>

</div>


<!-- =========================
     LISTA
========================= -->

<div class="card">

<h2>Meus eventos</h2>

<div id="eventos" class="event-grid">

<div class="loading">
Carregando eventos...
</div>

</div>

</div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sZr8tb-pVqp5glsh8hWzKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec";

const SITE =
"https://gumath121.github.io/qr-fotos/";


let resultadoData = null;


/* =====================================================
   JSONP
===================================================== */

function jsonp(url, callback) {

    const script = document.createElement("script");

    const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 10000);

    window[callbackName] = function(data) {

        callback(data);

        delete window[callbackName];

        script.remove();

    };

    script.src =
        url +
        (url.includes("?") ? "&" : "?") +
        "callback=" +
        callbackName;

    document.body.appendChild(script);
}


/* =====================================================
   CRIAR EVENTO
===================================================== */

function criarEvento() {

    const nome =
        document.getElementById("nome").value.trim();

    const id =
        document.getElementById("id").value.trim();

    const tipo =
        document.getElementById("tipo").value;

    const mensagem =
        document.getElementById("mensagem").value.trim();

    const cor =
        document.getElementById("cor").value;


    if (!nome) {

        alert("Digite o nome do evento.");

        return;

    }


    let url =
        API +
        "?acao=criarEvento" +
        "&nome=" +
        encodeURIComponent(nome) +
        "&tipo=" +
        encodeURIComponent(tipo) +
        "&mensagem=" +
        encodeURIComponent(mensagem) +
        "&cor=" +
        encodeURIComponent(cor);


    if (id) {

        url +=
            "&id=" +
            encodeURIComponent(id);

    }


    jsonp(url, function(data) {

        if (!data || !data.sucesso) {

            alert(
                data && data.erro
                ? data.erro
                : "Não foi possível criar o evento."
            );

            return;

        }


        resultadoData = data;


        document.getElementById("resultado")
            .style.display = "block";


        document.getElementById("resultadoNome")
            .innerHTML =
            "<strong>" +
            escapeHTML(data.nome) +
            "</strong>";


        document.getElementById("resultadoEvento")
            .innerHTML =
            "Evento: " +
            escapeHTML(data.link);


        document.getElementById("resultadoAlbum")
            .innerHTML =
            "Álbum: " +
            escapeHTML(data.album);


        document.getElementById("nome").value = "";
        document.getElementById("id").value = "";
        document.getElementById("mensagem").value = "";


        carregarEventos();

    });

}


/* =====================================================
   CARREGAR EVENTOS
===================================================== */

function carregarEventos() {

    const container =
        document.getElementById("eventos");


    container.innerHTML =
        '<div class="loading">Carregando eventos...</div>';


    jsonp(
        API + "?acao=listarEventos",
        function(data) {

            if (
                !data ||
                !data.sucesso ||
                !Array.isArray(data.eventos)
            ) {

                container.innerHTML =
                    '<div class="empty">Não foi possível carregar os eventos.</div>';

                return;

            }


            if (data.eventos.length === 0) {

                container.innerHTML =
                    '<div class="empty">Nenhum evento criado ainda.</div>';

                return;

            }


            container.innerHTML = "";


            data.eventos.forEach(function(evento, index) {

                const card =
                    document.createElement("div");

                card.className =
                    "event-card";


                const eventUrl =
                    SITE +
                    "index.html?evento=" +
                    encodeURIComponent(evento.id);


                const albumUrl =
                    SITE +
                    "album.html?evento=" +
                    encodeURIComponent(evento.id);


                const qrUrl =
                    "https://quickchart.io/qr?size=500&text=" +
                    encodeURIComponent(eventUrl);


                card.innerHTML = `

                    <div class="event-title">
                        ${escapeHTML(evento.nome)}
                    </div>

                    <div class="event-id">
                        ID: ${escapeHTML(evento.id)}
                    </div>

                    <div class="event-type">
                        ${escapeHTML(evento.tipo || "Evento")}
                    </div>

                    <div class="photo-count">
                        <strong>—</strong>
                        fotos
                    </div>

                    <div class="actions">

                        <button
                            class="btn-event"
                            onclick="window.open('${eventUrl}', '_blank')"
                        >
                            EVENTO
                        </button>

                        <button
                            class="btn-album"
                            onclick="window.open('${albumUrl}', '_blank')"
                        >
                            ÁLBUM
                        </button>

                        <button
                            class="btn-qr"
                            onclick="toggleQR(${index})"
                        >
                            MOSTRAR QR CODE
                        </button>

                    </div>

                    <div
                        class="qr-area"
                        id="qr-${index}"
                    >

                        <img
                            src="${qrUrl}"
                            alt="QR Code"
                        >

                        <div class="qr-link">
                            ${escapeHTML(eventUrl)}
                        </div>

                        <br>

                        <button
                            class="btn-event"
                            onclick="window.open('${qrUrl}', '_blank')"
                        >
                            ABRIR QR
                        </button>

                    </div>

                `;


                container.appendChild(card);

            });

        }
    );

}


/* =====================================================
   QR CODE
===================================================== */

function toggleQR(index) {

    const area =
        document.getElementById("qr-" + index);


    if (!area) return;


    if (
        area.style.display === "block"
    ) {

        area.style.display = "none";

    } else {

        area.style.display = "block";

    }

}


/* =====================================================
   RESULTADO
===================================================== */

function abrirResultadoEvento() {

    if (!resultadoData) return;

    window.open(
        resultadoData.link,
        "_blank"
    );

}


function abrirResultadoAlbum() {

    if (!resultadoData) return;

    window.open(
        resultadoData.album,
        "_blank"
    );

}


function abrirResultadoQR() {

    if (!resultadoData) return;


    const qr =
        "https://quickchart.io/qr?size=800&text=" +
        encodeURIComponent(resultadoData.link);


    window.open(qr, "_blank");

}


/* =====================================================
   SEGURANÇA HTML
===================================================== */

function escapeHTML(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   INICIAR
===================================================== */

carregarEventos();

</script>

</body>
</html>
