* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

.container {

    padding: 30px 20px 60px;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 42px;

.subtitle {

}

.usuario-logado {

.btn-sair {

    font-size: 12px;

}

.card {

    padding: 25px;

    box-shadow:

.card-title {
    font-size: 20px;

    margin-bottom: 20px;

    color: #d6b36a;
}

.form-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

.form-group {
    display: flex;

    gap: 7px;
}

.form-group.full {
    grid-column: 1 / -1;

    border-radius: 10px;

    color: white;

    padding: 13px;

    font-size: 15px;

    outline: none;
}

input:focus,
textarea:focus {

    border-color: #d6b36a;

}

textarea {

    min-height: 90px;

    resize: vertical;

}


/* BOTÕES */

.buttons {

    display: flex;

    gap: 12px;

    margin-top: 20px;

    flex-wrap: wrap;
}

button {

    border-radius: 10px;

    padding: 13px 20px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.btn-primary {

            #a67c2f
        );

    color: #111;
}

.btn-primary:hover {

    transform:
        translateY(-1px);

    filter:
        brightness(1.1);
}

.btn-secondary {
