<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nossas memórias</title>


<style>

/* =====================================================
   FONTES
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #3a3024 0%,
            #17130f 35%,
            #080706 75%
        );

    color: #f5eee3;

    font-family:
        'Montserrat',
        sans-serif;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 45px 20px 60px;

}


/* =====================================================
   CABEÇALHO
===================================================== */

header {

    text-align: center;

    margin-bottom: 35px;

}


.ornamento {

    color: #c9a96e;

    font-size: 22px;

    letter-spacing: 8px;

    margin-bottom: 15px;

}


h1 {

    font-family:
        'Cormorant Garamond',
        serif;

    font-size: 48px;

    line-height: 1;

    font-weight: 500;

    margin: 0;

}


.linha {

    width: 55px;

    height: 1px;

    background: #c9a96e;

    margin: 22px auto;

}


.subtitulo {

    color: #cfc5b6;

    font-size: 13px;

    line-height: 1.7;

    margin: 0 auto;

    max-width: 500px;

}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

.topo {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;

    margin-bottom: 18px;

}


.contador {

    color: #cfc5b6;

    font-size: 12px;

}


.acoes-topo {

    display: flex;

    gap: 8px;

}


.botao-topo {

    border: 1px solid
        rgba(201,169,110,.45);

    background:
        rgba(0,0,0,.25);

    color: #c9a96e;

    border-radius: 50px;

    padding: 9px 14px;

    font-family:
        'Montserrat',
        sans-serif;

    font-size: 11px;

    cursor: pointer;

    transition: .2s;

}


.botao-topo:hover {

    background:
        rgba(201,169,110,.12);

}


.botao-topo:active {

    transform: scale(.96);

}


/* =====================================================
   FILTROS
===================================================== */

.filtros {

    display: flex;

    justify-content: center;

    gap: 8px;

    margin-bottom: 25px;

    flex-wrap: wrap;

}


.filtro {

    border: 1px solid
        rgba(201,169,110,.28);

    background:
        rgba(0,0,0,.22);

    color: #a99d8d;

    border-radius: 50px;

    padding: 9px 16px;

    font-family:
        'Montserrat',
        sans-serif;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .3px;

    cursor: pointer;

    transition: .2s;

}


.filtro:hover {

    border-color:
        rgba(201,169,110,.55);

    color: #c9a96e;

}


.filtro.ativo {

    background:
        rgba(201,169,110,.13);

    border-color:
        rgba(201,169,110,.65);

    color: #c9a96e;

}


/* =====================================================
   GALERIA
===================================================== */

.galeria {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

}


/* =====================================================
   CARD DE FOTO
===================================================== */

.foto {

    position: relative;

    overflow: hidden;

    border-radius: 12px;

    aspect-ratio: 1 / 1;

    background: #111;

    cursor: pointer;

    border:
        1px solid
        rgba(201,169,110,.18);

    animation:
        aparecer .5s ease both;

}


.foto img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    transition:
        transform .5s ease;

}


.foto:hover img {

    transform: scale(1.04);

}


/* =====================================================
   CARD DE VÍDEO
===================================================== */

.video-card {

    position: relative;

    overflow: hidden;

    border-radius: 12px;

    aspect-ratio: 1 / 1;

    background: #0d0c0b;

    border:
        1px solid
        rgba(201,169,110,.22);

    animation:
        aparecer .5s ease both;

}


.video-card video {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    background: #050505;

}


/* =====================================================
   ETIQUETA RECADO
===================================================== */

.etiqueta-video {

    position: absolute;

    top: 9px;

    left: 9px;

    z-index: 5;

    padding: 6px 9px;

    border-radius: 30px;

    background:
        rgba(10,8,6,.78);

    border:
        1px solid
        rgba(201,169,110,.45);

    color: #c9a96e;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: .5px;

    backdrop-filter:
        blur(8px);

}


/* =====================================================
   ANIMAÇÃO
===================================================== */

@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            translateY(10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   CARREGANDO
===================================================== */

.carregando {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 60px 20px;

    color: #cfc5b6;

    font-size: 13px;

}


.carregando span {

    display: block;

    font-family:
        'Cormorant Garamond',
        serif;

    color: #c9a96e;

    font-size: 28px;

    margin-bottom: 10px;

}


/* =====================================================
   SEM MÍDIA
===================================================== */

.sem-fotos {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 70px 20px;

    color: #cfc5b6;

    font-size: 13px;

    line-height: 1.8;

}


.sem-fotos strong {

    display: block;

    font-family:
        'Cormorant Garamond',
        serif;

    color: #c9a96e;

    font-size: 28px;

    font-weight: 500;

    margin-bottom: 10px;

}


/* =====================================================
   BOTÃO VOLTAR
===================================================== */

.voltar {

    display: block;

    width: 100%;

    max-width: 400px;

    margin: 40px auto 0;

    padding: 16px 20px;

    border-radius: 50px;

    border:
        1px solid
        rgba(201,169,110,.5);

    background: transparent;

    color: #c9a96e;

    text-align: center;

    text-decoration: none;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: 1px;

    transition: .2s;

}


.voltar:hover {

    background:
        rgba(201,169,110,.1);

}


.voltar:active {

    transform: scale(.98);

}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape {

    text-align: center;

    margin-top: 30px;

    color: #81776b;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size: 17px;

}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.94);

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.lightbox.ativo {

    display: flex;

}


.lightbox img {

    max-width: 100%;

    max-height: 78vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 20px 80px rgba(0,0,0,.7);

}


/* =====================================================
   BOTÃO FECHAR
===================================================== */

.fechar {

    position: absolute;

    top: 18px;

    right: 18px;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.5);

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 10;

}


/* =====================================================
   VÍDEO NO LIGHTBOX
===================================================== */

.videoGrande {

    display: none;

    max-width: 95vw;

    max-height: 78vh;

    width: auto;

    height: auto;

    border-radius: 10px;

    background: #000;

    box-shadow:
        0 20px 80px rgba(0,0,0,.8);

}


/* =====================================================
   AÇÕES DA MÍDIA
===================================================== */

.acoes-foto {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 20px;

    display: flex;

    justify-content: center;

    gap: 10px;

    z-index: 20;

}


.acao-foto {

    border: 1px solid
        rgba(201,169,110,.5);

    background:
        rgba(15,12,9,.9);

    color: #c9a96e;

    border-radius: 50px;

    padding: 12px 18px;

    font-family:
        'Montserrat',
        sans-serif;

    font-size: 11px;

    font-weight: 600;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

}


.acao-foto:active {

    transform: scale(.96);

}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 700px) {

    .galeria {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 10px;

    }


    .foto,
    .video-card {

        border-radius: 14px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .container {

        padding:
            35px 12px 45px;

    }


    h1 {

        font-size: 42px;

    }


    .topo {

        padding:
            0 3px;

    }


    .botao-topo {

        padding:
            8px 11px;

    }


    .filtros {

        margin-bottom: 20px;

    }


    .filtro {

        padding:
            8px 13px;

        font-size: 9px;

    }


    .acoes-foto {

        bottom: 15px;

    }


    .acao-foto {

        padding:
            11px 14px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         CABEÇALHO
    ================================================== -->

    <header>

        <div class="ornamento">

            ✦

        </div>


        <h1 id="tituloEvento">

            Nossas memórias

        </h1>


        <div class="linha"></div>


        <p
            class="subtitulo"
            id="mensagemEvento">

            Momentos especiais registrados por quem
            fez parte desse dia. ❤️

        </p>

    </header>


    <!-- =================================================
         TOPO
    ================================================== -->

    <div class="topo">


        <div
            class="contador"
            id="contador">

            Carregando memórias...

        </div>


        <div class="acoes-topo">

            <button
                class="botao-topo"
                id="atualizar">

                ↻ Atualizar

            </button>

        </div>


    </div>


    <!-- =================================================
         FILTROS
    ================================================== -->

    <div class="filtros">


        <button
            class="filtro ativo"
            data-filtro="todos">

            ✨ TODOS

        </button>


        <button
            class="filtro"
            data-filtro="foto">

            📷 FOTOS

        </button>


        <button
            class="filtro"
            data-filtro="video">

            🎥 RECADOS

        </button>


    </div>


    <!-- =================================================
         GALERIA
    ================================================== -->

    <div
        class="galeria"
        id="galeria">


        <div class="carregando">

            <span>✦</span>

            Carregando nossas memórias...

        </div>


    </div>


    <!-- =================================================
         VOLTAR
    ================================================== -->

    <a
        href="index.html"
        id="voltar"
        class="voltar">

        📷 &nbsp; VOLTAR PARA TIRAR FOTOS

    </a>


    <div class="rodape">

        Feito para guardar momentos.

    </div>


</div>



<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    class="lightbox"
    id="lightbox">


    <!-- FECHAR -->

    <button
        class="fechar"
        id="fechar">

        ×

    </button>


    <!-- FOTO -->

    <img
        id="fotoGrande"
        src=""
        alt="Foto do evento">


    <!-- VÍDEO -->

    <video
        id="videoGrande"
        class="videoGrande"
        controls
        playsinline>
    </video>


    <!-- AÇÕES -->

    <div class="acoes-foto">


        <button
            class="acao-foto"
            id="baixar">

            ↓ &nbsp; BAIXAR

        </button>


        <button
            class="acao-foto"
            id="compartilhar">

            ↗ &nbsp; COMPARTILHAR

        </button>


    </div>


</div>



<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

/*
 * URL CORRETA DO GOOGLE APPS SCRIPT
 *
 * IMPORTANTE:
 * ...p5glsh8hWzKE...
 *
 * O "h" e o "z" minúsculo fazem parte
 * da URL correta.
 */

const API =
"https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sZr8tb-pVqp5glsh8hWzKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec";


/* =====================================================
   EVENTO ATUAL
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const evento =
    parametros.get("evento") ||
    "teste";


/* =====================================================
   ELEMENTOS
===================================================== */

const galeria =
    document.getElementById("galeria");


const contador =
    document.getElementById("contador");


const atualizar =
    document.getElementById("atualizar");


const lightbox =
    document.getElementById("lightbox");


const fotoGrande =
    document.getElementById("fotoGrande");


const videoGrande =
    document.getElementById("videoGrande");


const fechar =
    document.getElementById("fechar");


const baixar =
    document.getElementById("baixar");


const compartilhar =
    document.getElementById("compartilhar");


const voltar =
    document.getElementById("voltar");


const filtros =
    document.querySelectorAll(".filtro");


/* =====================================================
   VARIÁVEIS
===================================================== */

let fotos = [];

let videos = [];

let midias = [];

let midiaAtual = null;

let filtroAtual = "todos";

let quantidadeAnterior = 0;


/* =====================================================
   MANTER EVENTO AO VOLTAR
===================================================== */

voltar.href =
    "index.html?evento=" +
    encodeURIComponent(evento);


/* =====================================================
   CARREGAR CONFIGURAÇÃO DO EVENTO
===================================================== */

function carregarEvento() {

    const callbackName =
        "evento_" +
        Date.now();


    window[callbackName] =
        function(config) {

            delete window[callbackName];


            if (
                !config ||
                config.erro
            ) {

                console.log(
                    "Evento não encontrado."
                );

                return;

            }


            const titulo =
                document.getElementById(
                    "tituloEvento"
                );


            if (titulo) {

                titulo.innerHTML =
                    config.nome;

            }


            const mensagem =
                document.getElementById(
                    "mensagemEvento"
                );


            if (mensagem) {

                mensagem.innerHTML =
                    config.mensagem;

            }


            if (config.cor) {

                document.documentElement
                    .style.setProperty(
                        "--cor-evento",
                        config.cor
                    );

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API +
        "?evento=" +
        encodeURIComponent(evento) +
        "&config=true" +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {

            delete window[callbackName];

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   CARREGAR MÍDIAS DO EVENTO
===================================================== */

function carregarFotos() {

    galeria.innerHTML = `

        <div class="carregando">

            <span>✦</span>

            Carregando nossas memórias...

        </div>

    `;


    const callbackName =
        "receberMidias_" +
        Date.now();


    window[callbackName] =
        function(resposta) {

            delete window[callbackName];


            if (
                !resposta ||
                resposta.sucesso !== true
            ) {

                mostrarErro();

                return;

            }


            /*
             * O backend retorna:
             *
             * fotos: [...]
             * videos: [...]
             * totalFotos: número
             * totalVideos: número
             * total: número total de mídias
             */


            fotos =
                Array.isArray(
                    resposta.fotos
                )
                ? resposta.fotos
                : [];


            videos =
                Array.isArray(
                    resposta.videos
                )
                ? resposta.videos
                : [];


            /*
             * Garante o tipo das mídias.
             */

            fotos =
                fotos.map(
                    function(item) {

                        return {
                            ...item,
                            tipo: "foto"
                        };

                    }
                );


            videos =
                videos.map(
                    function(item) {

                        return {
                            ...item,
                            tipo: "video"
                        };

                    }
                );


            /*
             * Junta fotos e vídeos.
             */

            midias =
                [
                    ...fotos,
                    ...videos
                ];


            /*
             * Ordena tudo pelo momento
             * de envio, do mais recente
             * para o mais antigo.
             */

            midias.sort(
                function(a, b) {

                    return (
                        Number(b.data || 0) -
                        Number(a.data || 0)
                    );

                }
            );


            atualizarContador();

            renderizarGaleria();

        };


    const script =
        document.createElement(
            "script"
        );


    /*
     * Informa explicitamente ao Apps Script
     * que esta requisição é para listar o álbum
     * DO EVENTO ATUAL.
     */

    script.src =
        API +
        "?evento=" +
        encodeURIComponent(evento) +
        "&album=true" +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


    script.onerror =
        function() {

            delete window[callbackName];

            mostrarErro();

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   CONTADOR
===================================================== */

function atualizarContador() {

    const totalFotos =
        fotos.length;


    const totalVideos =
        videos.length;


    if (
        totalFotos === 0 &&
        totalVideos === 0
    ) {

        contador.innerText =
            "Nenhuma memória compartilhada";

        return;

    }


    let texto = "";


    if (totalFotos > 0) {

        texto +=
            "📷 " +
            totalFotos +
            (
                totalFotos === 1
                    ? " foto"
                    : " fotos"
            );

    }


    if (
        totalFotos > 0 &&
        totalVideos > 0
    ) {

        texto +=
            "  •  ";

    }


    if (totalVideos > 0) {

        texto +=
            "🎥 " +
            totalVideos +
            (
                totalVideos === 1
                    ? " recado"
                    : " recados"
            );

    }


    contador.innerText =
        texto;

}


/* =====================================================
   FILTRAR MÍDIAS
===================================================== */

function obterMidiasFiltradas() {

    if (
        filtroAtual === "foto"
    ) {

        return fotos;

    }


    if (
        filtroAtual === "video"
    ) {

        return videos;

    }


    return midias;

}


/* =====================================================
   RENDERIZAR GALERIA
===================================================== */

function renderizarGaleria() {

    const lista =
        obterMidiasFiltradas();


    const novasMidias =
        midias.length >
        quantidadeAnterior;


    quantidadeAnterior =
        midias.length;


    galeria.innerHTML = "";


    /* =================================================
       SEM MÍDIA
    ================================================= */

    if (
        lista.length === 0
    ) {

        let titulo =
            "Ainda não temos fotos";


        let texto =
            "Seja o primeiro a registrar<br>" +
            "um momento especial. ❤️";


        if (
            filtroAtual === "video"
        ) {

            titulo =
                "Ainda não temos recados";


            texto =
                "Seja o primeiro a deixar<br>" +
                "um recado em vídeo. 🎥";

        }


        if (
            filtroAtual === "todos" &&
            fotos.length === 0 &&
            videos.length > 0
        ) {

            titulo =
                "Ainda não temos fotos";


            texto =
                "Mas já temos recados em vídeo. 🎥";

        }


        galeria.innerHTML = `

            <div class="sem-fotos">

                <strong>
                    ${titulo}
                </strong>

                ${texto}

            </div>

        `;


        return;

    }


    /*
     * Renderiza cada mídia.
     */

    lista.forEach(
        function(midia, indice) {

            if (
                midia.tipo === "video"
            ) {

                criarCardVideo(
                    midia,
                    indice
                );

            }

            else {

                criarCardFoto(
                    midia,
                    indice
                );

            }

        }
    );


    /*
     * Pequeno feedback quando
     * chegam novas mídias.
     */

    if (
        novasMidias &&
        midias.length > 0
    ) {

        atualizarContador();

    }

}


/* =====================================================
   CRIAR CARD DE FOTO
===================================================== */

function criarCardFoto(
    foto,
    indice
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "foto";


    div.style.animationDelay =
        (indice * 0.03) +
        "s";


    const img =
        document.createElement(
            "img"
        );


    img.loading =
        "lazy";


    img.alt =
        "Foto compartilhada";


    img.src =

        "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(
            foto.id
        ) +
        "&sz=w1000";


    img.onerror =
        function() {

            this.style.opacity =
                "0.3";

        };


    div.appendChild(
        img
    );


    div.addEventListener(
        "click",
        function() {

            abrirMidia(foto);

        }
    );


    galeria.appendChild(
        div
    );

}


/* =====================================================
   CRIAR CARD DE VÍDEO
===================================================== */

function criarCardVideo(
    video,
    indice
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "video-card";


    div.style.animationDelay =
        (indice * 0.03) +
        "s";


    const etiqueta =
        document.createElement(
            "div"
        );


    etiqueta.className =
        "etiqueta-video";


    etiqueta.innerHTML =
        "🎥 RECADO";


    div.appendChild(
        etiqueta
    );


    const player =
        document.createElement(
            "video"
        );


    player.controls =
        true;


    player.playsInline =
        true;


    player.preload =
        "metadata";


    player.poster =

        "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(
            video.id
        ) +
        "&sz=w1000";


    player.src =

        "https://drive.google.com/uc?export=download&id=" +
        encodeURIComponent(
            video.id
        );


    player.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        }
    );


    div.appendChild(
        player
    );


    div.addEventListener(
        "click",
        function(event) {

            if (
                event.target === player
            ) {

                return;

            }


            abrirMidia(video);

        }
    );


    galeria.appendChild(
        div
    );

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro() {

    contador.innerText =
        "Não foi possível carregar as memórias";


    galeria.innerHTML = `

        <div class="sem-fotos">

            <strong>
                Ops...
            </strong>

            Não conseguimos carregar<br>
            as memórias agora.

            <br><br>

            Tente atualizar a página.

        </div>

    `;

}


/* =====================================================
   ABRIR MÍDIA
===================================================== */

function abrirMidia(midia) {

    midiaAtual =
        midia;


    lightbox.classList.add(
        "ativo"
    );


    document.body.style.overflow =
        "hidden";


    if (
        midia.tipo === "foto"
    ) {

        videoGrande.pause();

        videoGrande.removeAttribute(
            "src"
        );

        videoGrande.style.display =
            "none";


        fotoGrande.style.display =
            "block";


        fotoGrande.src =

            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(
                midia.id
            ) +
            "&sz=w2000";


        return;

    }


    fotoGrande.style.display =
        "none";


    fotoGrande.removeAttribute(
        "src"
    );


    videoGrande.style.display =
        "block";


    videoGrande.src =

        "https://drive.google.com/uc?export=download&id=" +
        encodeURIComponent(
            midia.id
        );


    videoGrande.load();


    videoGrande.play()
        .catch(
            function() {}
        );

}


/* =====================================================
   FECHAR LIGHTBOX
===================================================== */

function fecharFoto() {

    lightbox.classList.remove(
        "ativo"
    );


    videoGrande.pause();

    videoGrande.removeAttribute(
        "src"
    );


    fotoGrande.removeAttribute(
        "src"
    );


    fotoGrande.style.display =
        "block";


    videoGrande.style.display =
        "none";


    midiaAtual =
        null;


    document.body.style.overflow =
        "";

}


fechar.addEventListener(
    "click",
    fecharFoto
);


/* =====================================================
   CLICAR FORA
===================================================== */

lightbox.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            lightbox
        ) {

            fecharFoto();

        }

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            fecharFoto();

        }

    }
);


/* =====================================================
   BAIXAR MÍDIA
===================================================== */

baixar.addEventListener(
    "click",
    function() {

        if (!midiaAtual)
            return;


        const url =

            "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(
                midiaAtual.id
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        link.click();

    }
);


/* =====================================================
   COMPARTILHAR MÍDIA
===================================================== */

compartilhar.addEventListener(
    "click",
    async function() {

        if (!midiaAtual)
            return;


        const url =

            "https://drive.google.com/uc?export=view&id=" +
            encodeURIComponent(
                midiaAtual.id
            );


        if (
            navigator.share
        ) {

            try {

                await navigator.share({

                    title:
                        midiaAtual.tipo === "video"
                            ? "Um recado especial ❤️"
                            : "Uma memória especial ❤️",

                    text:
                        midiaAtual.tipo === "video"
                            ? "Confira esse recado!"
                            : "Confira essa foto!",

                    url:
                        url

                });

            }

            catch (erro) {

                /* Usuário cancelou. */

            }


            return;

        }


        try {

            await navigator.clipboard.writeText(
                url
            );


            const textoOriginal =
                compartilhar.innerHTML;


            compartilhar.innerHTML =
                "✓ &nbsp; LINK COPIADO";


            setTimeout(
                function() {

                    compartilhar.innerHTML =
                        textoOriginal;

                },
                2000
            );

        }

        catch (erro) {

            window.open(
                url,
                "_blank"
            );

        }

    }
);


/* =====================================================
   FILTROS
===================================================== */

filtros.forEach(
    function(botao) {

        botao.addEventListener(
            "click",
            function() {

                filtros.forEach(
                    function(item) {

                        item.classList.remove(
                            "ativo"
                        );

                    }
                );


                botao.classList.add(
                    "ativo"
                );


                filtroAtual =
                    botao.dataset.filtro;


                renderizarGaleria();

            }
        );

    }
);


/* =====================================================
   BOTÃO ATUALIZAR
===================================================== */

atualizar.addEventListener(
    "click",
    function() {

        carregarFotos();

    }
);


/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */

setInterval(
    function() {

        carregarFotos();

    },
    10000
);


/* =====================================================
   PRIMEIRO CARREGAMENTO
===================================================== */

carregarEvento();

carregarFotos();


</script>
