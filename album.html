<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nossas memórias</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #3a3024 0%,
            #17130f 35%,
            #080706 75%
        );

    color: #f5eee3;

    font-family:
        'Montserrat',
        sans-serif;

}

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 45px 20px 60px;

}

header {

    text-align: center;

    margin-bottom: 32px;

}

.ornamento {

    color: #c9a96e;

    font-size: 22px;

    letter-spacing: 8px;

    margin-bottom: 15px;

}

h1 {

    font-family:
        'Cormorant Garamond',
        serif;

    font-size: 48px;

    line-height: 1;

    font-weight: 500;

    margin: 0;

}

.linha {

    width: 55px;

    height: 1px;

    background: #c9a96e;

    margin: 22px auto;

}

.subtitulo {

    color: #cfc5b6;

    font-size: 13px;

    line-height: 1.7;

    margin: 0 auto;

    max-width: 520px;

}

.topo {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;

    margin-bottom: 16px;

}

.contador {

    color: #cfc5b6;

    font-size: 12px;

}

.botao-topo {

    border: 1px solid rgba(201,169,110,.45);

    background: rgba(0,0,0,.25);

    color: #c9a96e;

    border-radius: 50px;

    padding: 9px 14px;

    font-family: 'Montserrat', sans-serif;

    font-size: 11px;

    cursor: pointer;

    transition: .2s;

}

.botao-topo:hover {

    background: rgba(201,169,110,.12);

}

.botao-topo:active {

    transform: scale(.96);

}


/* =====================================================
   ABAS
===================================================== */

.filtros {

    display: flex;

    width: 100%;

    max-width: 560px;

    margin: 0 auto 28px;

    padding: 5px;

    border-radius: 50px;

    background: rgba(0,0,0,.35);

    border: 1px solid rgba(201,169,110,.22);

    gap: 4px;

}

.filtro {

    flex: 1;

    border: 0;

    background: transparent;

    color: #9f9486;

    border-radius: 40px;

    padding: 12px 14px;

    font-family: 'Montserrat', sans-serif;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .4px;

    cursor: pointer;

    transition: .25s;

}

.filtro:hover {

    color: #c9a96e;

}

.filtro.ativo {

    background: linear-gradient(
        135deg,
        rgba(201,169,110,.22),
        rgba(201,169,110,.08)
    );

    color: #e1c486;

    box-shadow:
        inset 0 0 0 1px rgba(201,169,110,.25),
        0 4px 20px rgba(0,0,0,.25);

}


/* =====================================================
   GALERIA
===================================================== */

.galeria {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

}


/* =====================================================
   FOTO
===================================================== */

.foto {

    position: relative;

    overflow: hidden;

    border-radius: 12px;

    aspect-ratio: 1 / 1;

    background: #111;

    cursor: pointer;

    border: 1px solid rgba(201,169,110,.18);

    animation: aparecer .5s ease both;

}

.foto img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    transition: transform .5s ease;

}

.foto:hover img {

    transform: scale(1.05);

}


/* =====================================================
   VIDEO
===================================================== */

.video-card {

    position: relative;

    overflow: hidden;

    border-radius: 12px;

    aspect-ratio: 1 / 1;

    background: #090909;

    border: 1px solid rgba(201,169,110,.22);

    animation: aparecer .5s ease both;

}

.video-card video {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    background: #050505;

}


/* =====================================================
   ETIQUETA
===================================================== */

.etiqueta-video {

    position: absolute;

    top: 9px;

    left: 9px;

    z-index: 5;

    padding: 6px 10px;

    border-radius: 30px;

    background: rgba(10,8,6,.82);

    border: 1px solid rgba(201,169,110,.45);

    color: #c9a96e;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: .5px;

    backdrop-filter: blur(8px);

    pointer-events: none;

}


/* =====================================================
   PLAY OVERLAY
===================================================== */

.video-play {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    width: 58px;

    height: 58px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(10,8,6,.78);

    border: 1px solid rgba(201,169,110,.6);

    color: #e1c486;

    font-size: 23px;

    pointer-events: none;

    backdrop-filter: blur(8px);

    transition: .2s;

}

.video-card:hover .video-play {

    transform:
        translate(-50%, -50%)
        scale(1.08);

}


/* =====================================================
   CARREGANDO
===================================================== */

.carregando {

    grid-column: 1 / -1;

    text-align: center;

    padding: 65px 20px;

    color: #cfc5b6;

    font-size: 13px;

}

.carregando span {

    display: block;

    font-family: 'Cormorant Garamond', serif;

    color: #c9a96e;

    font-size: 30px;

    margin-bottom: 10px;

    animation: brilho 1.5s infinite;

}


/* =====================================================
   SEM MÍDIA
===================================================== */

.sem-fotos {

    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 20px;

    color: #cfc5b6;

    font-size: 13px;

    line-height: 1.8;

}

.sem-fotos strong {

    display: block;

    font-family: 'Cormorant Garamond', serif;

    color: #c9a96e;

    font-size: 29px;

    font-weight: 500;

    margin-bottom: 10px;

}


/* =====================================================
   VOLTAR
===================================================== */

.voltar {

    display: block;

    width: 100%;

    max-width: 400px;

    margin: 40px auto 0;

    padding: 16px 20px;

    border-radius: 50px;

    border: 1px solid rgba(201,169,110,.5);

    background: transparent;

    color: #c9a96e;

    text-align: center;

    text-decoration: none;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: 1px;

    transition: .2s;

}

.voltar:hover {

    background: rgba(201,169,110,.1);

}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape {

    text-align: center;

    margin-top: 30px;

    color: #81776b;

    font-family: 'Cormorant Garamond', serif;

    font-size: 17px;

}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.96);

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

}

.lightbox.ativo {

    display: flex;

}

.lightbox img {

    max-width: 95vw;

    max-height: 78vh;

    object-fit: contain;

    border-radius: 8px;

}

.videoGrande {

    display: none;

    max-width: 95vw;

    max-height: 78vh;

    width: auto;

    height: auto;

    border-radius: 10px;

    background: #000;

}

.fechar {

    position: absolute;

    top: 18px;

    right: 18px;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.25);

    background: rgba(0,0,0,.6);

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 10;

}


/* =====================================================
   AÇÕES
===================================================== */

.acoes-foto {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 20px;

    display: flex;

    justify-content: center;

    gap: 10px;

    z-index: 20;

}

.acao-foto {

    border: 1px solid rgba(201,169,110,.5);

    background: rgba(15,12,9,.92);

    color: #c9a96e;

    border-radius: 50px;

    padding: 12px 18px;

    font-family: 'Montserrat', sans-serif;

    font-size: 11px;

    font-weight: 600;

    cursor: pointer;

    backdrop-filter: blur(10px);

}


/* =====================================================
   ANIMAÇÕES
===================================================== */

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(10px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}

@keyframes brilho {

    0%,100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }

}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 700px) {

    .galeria {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 10px;

    }

    .foto,
    .video-card {

        border-radius: 14px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    .container {

        padding:
            35px 12px 45px;

    }

    h1 {

        font-size: 42px;

    }

    .topo {

        padding: 0 3px;

    }

    .filtro {

        padding: 11px 7px;

        font-size: 9px;

    }

    .video-play {

        width: 52px;

        height: 52px;

    }

}

</style>

</head>


<body>


<div class="container">


<header>

    <div class="ornamento">✦</div>

    <h1 id="tituloEvento">
        Nossas memórias
    </h1>

    <div class="linha"></div>

    <p class="subtitulo" id="mensagemEvento">
        Momentos especiais registrados por quem
        fez parte desse dia. ❤️
    </p>

</header>


<div class="topo">

    <div class="contador" id="contador">
        Carregando memórias...
    </div>

    <button
        class="botao-topo"
        id="atualizar">
        ↻ Atualizar
    </button>

</div>


<!-- =====================================================
     ABAS
===================================================== -->

<div class="filtros">

    <button
        class="filtro ativo"
        data-filtro="todos">

        ✨ TODOS

    </button>

    <button
        class="filtro"
        data-filtro="foto">

        📷 FOTOS

    </button>

    <button
        class="filtro"
        data-filtro="video">

        🎥 RECADOS

    </button>

</div>


<div
    class="galeria"
    id="galeria">

    <div class="carregando">

        <span>✦</span>

        Carregando nossas memórias...

    </div>

</div>


<a
    href="index.html"
    id="voltar"
    class="voltar">

    📷 &nbsp; VOLTAR PARA TIRAR FOTOS

</a>


<div class="rodape">

    Feito para guardar momentos.

</div>


</div>


<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    class="lightbox"
    id="lightbox">

    <button
        class="fechar"
        id="fechar">

        ×

    </button>


    <img
        id="fotoGrande"
        src=""
        alt="Foto do evento">


    <video
        id="videoGrande"
        class="videoGrande"
        controls
        playsinline>
    </video>


    <div class="acoes-foto">

        <button
            class="acao-foto"
            id="baixar">

            ↓ &nbsp; BAIXAR

        </button>

        <button
            class="acao-foto"
            id="compartilhar">

            ↗ &nbsp; COMPARTILHAR

        </button>

    </div>

</div>


<script>


const API =
"https://script.google.com/macros/s/AKfycbw0Fygjoy58sKA7sRZ8tb-pVqp5glsh8hWZKEdENtTv-s8xsWIaedO416HP4t-Lng-8/exec";


const parametros =
new URLSearchParams(
    window.location.search
);


const evento =
parametros.get("evento") ||
"teste";


const galeria =
document.getElementById("galeria");

const contador =
document.getElementById("contador");

const atualizar =
document.getElementById("atualizar");

const lightbox =
document.getElementById("lightbox");

const fotoGrande =
document.getElementById("fotoGrande");

const videoGrande =
document.getElementById("videoGrande");

const fechar =
document.getElementById("fechar");

const baixar =
document.getElementById("baixar");

const compartilhar =
document.getElementById("compartilhar");

const voltar =
document.getElementById("voltar");

const filtros =
document.querySelectorAll(".filtro");


let fotos = [];

let videos = [];

let midias = [];

let midiaAtual = null;

let filtroAtual = "todos";


/* =====================================================
   VOLTAR
===================================================== */

voltar.href =
"index.html?evento=" +
encodeURIComponent(evento);


/* =====================================================
   EVENTO
===================================================== */

function carregarEvento() {

    const callback =
    "evento_" + Date.now();


    window[callback] =
    function(config) {

        delete window[callback];


        if (!config || config.erro)
            return;


        if (config.nome) {

            document.getElementById(
                "tituloEvento"
            ).textContent =
            config.nome;

        }


        if (config.mensagem) {

            document.getElementById(
                "mensagemEvento"
            ).textContent =
            config.mensagem;

        }

    };


    const script =
    document.createElement("script");


    script.src =
    API +
    "?evento=" +
    encodeURIComponent(evento) +
    "&config=true" +
    "&callback=" +
    callback;


    document.body.appendChild(script);

}


/* =====================================================
   CARREGAR MÍDIAS
===================================================== */

function carregarFotos() {

    galeria.innerHTML = `

        <div class="carregando">

            <span>✦</span>

            Carregando nossas memórias...

        </div>

    `;


    const callback =
    "midias_" + Date.now();


    window[callback] =
    function(resposta) {

        delete window[callback];


        if (
            !resposta ||
            resposta.sucesso !== true
        ) {

            mostrarErro();

            return;

        }


        fotos =
        Array.isArray(resposta.fotos)
        ? resposta.fotos.map(item => ({
            ...item,
            tipo: "foto"
        }))
        : [];


        videos =
        Array.isArray(resposta.videos)
        ? resposta.videos.map(item => ({
            ...item,
            tipo: "video"
        }))
        : [];


        midias =
        [
            ...fotos,
            ...videos
        ];


        midias.sort(
            (a,b) =>
            Number(b.data || 0) -
            Number(a.data || 0)
        );


        atualizarContador();

        renderizarGaleria();

    };


    const script =
    document.createElement("script");


    script.src =
    API +
    "?evento=" +
    encodeURIComponent(evento) +
    "&callback=" +
    callback +
    "&t=" +
    Date.now();


    script.onerror =
    function() {

        delete window[callback];

        mostrarErro();

    };


    document.body.appendChild(script);

}


/* =====================================================
   CONTADOR
===================================================== */

function atualizarContador() {

    const f =
    fotos.length;

    const v =
    videos.length;


    if (f === 0 && v === 0) {

        contador.textContent =
        "Nenhuma memória compartilhada";

        return;

    }


    let texto = "";


    if (f > 0) {

        texto +=
        "📷 " +
        f +
        (f === 1 ? " foto" : " fotos");

    }


    if (f > 0 && v > 0) {

        texto += "  •  ";

    }


    if (v > 0) {

        texto +=
        "🎥 " +
        v +
        (v === 1 ? " recado" : " recados");

    }


    contador.textContent =
    texto;

}


/* =====================================================
   FILTRO
===================================================== */

function obterLista() {

    if (filtroAtual === "foto")
        return fotos;

    if (filtroAtual === "video")
        return videos;

    return midias;

}


/* =====================================================
   GALERIA
===================================================== */

function renderizarGaleria() {

    const lista =
    obterLista();


    galeria.innerHTML = "";


    if (lista.length === 0) {

        let titulo =
        "Ainda não temos fotos";

        let texto =
        "Seja o primeiro a registrar<br>" +
        "um momento especial. ❤️";


        if (filtroAtual === "video") {

            titulo =
            "Ainda não temos recados";

            texto =
            "Seja o primeiro a deixar<br>" +
            "um recado em vídeo. 🎥";

        }


        if (
            filtroAtual === "todos" &&
            videos.length > 0
        ) {

            titulo =
            "Ainda não temos fotos";

            texto =
            "Mas já temos recados em vídeo. 🎥";

        }


        galeria.innerHTML = `

            <div class="sem-fotos">

                <strong>
                    ${titulo}
                </strong>

                ${texto}

            </div>

        `;

        return;

    }


    lista.forEach(
        (midia, indice) => {

            if (midia.tipo === "video") {

                criarCardVideo(
                    midia,
                    indice
                );

            } else {

                criarCardFoto(
                    midia,
                    indice
                );

            }

        }
    );

}


/* =====================================================
   FOTO
===================================================== */

function criarCardFoto(
    foto,
    indice
) {

    const div =
    document.createElement("div");


    div.className =
    "foto";


    div.style.animationDelay =
    (indice * .03) + "s";


    const img =
    document.createElement("img");


    img.loading =
    "lazy";


    img.alt =
    "Foto compartilhada";


    img.src =
    "https://drive.google.com/thumbnail?id=" +
    encodeURIComponent(foto.id) +
    "&sz=w1000";


    div.appendChild(img);


    div.onclick =
    () => abrirMidia(foto);


    galeria.appendChild(div);

}


/* =====================================================
   VIDEO
===================================================== */

function criarCardVideo(
    video,
    indice
) {

    const div =
    document.createElement("div");


    div.className =
    "video-card";


    div.style.animationDelay =
    (indice * .03) + "s";


    const etiqueta =
    document.createElement("div");


    etiqueta.className =
    "etiqueta-video";


    etiqueta.textContent =
    "🎥 RECADO";


    div.appendChild(etiqueta);


    const player =
    document.createElement("video");


    player.controls =
    true;

    player.playsInline =
    true;

    player.preload =
    "metadata";


    /*
     * IMPORTANTE:
     * usamos a URL de visualização,
     * não export=download.
     */

    player.src =
    "https://drive.google.com/uc?export=view&id=" +
    encodeURIComponent(video.id);


    player.addEventListener(
        "error",
        function() {

            console.log(
                "Erro ao carregar vídeo:",
                video.id
            );

        }
    );


    div.appendChild(player);


    const play =
    document.createElement("div");


    play.className =
    "video-play";


    play.innerHTML =
    "▶";


    div.appendChild(play);


    player.addEventListener(
        "play",
        function() {

            play.style.display =
            "none";

        }
    );


    player.addEventListener(
        "pause",
        function() {

            play.style.display =
            "flex";

        }
    );


    div.addEventListener(
        "click",
        function(event) {

            if (
                event.target === player ||
                player.contains(event.target)
            ) {

                return;

            }


            abrirMidia(video);

        }
    );


    galeria.appendChild(div);

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro() {

    contador.textContent =
    "Não foi possível carregar as memórias";


    galeria.innerHTML = `

        <div class="sem-fotos">

            <strong>
                Ops...
            </strong>

            Não conseguimos carregar<br>
            as memórias agora.

            <br><br>

            Tente atualizar a página.

        </div>

    `;

}


/* =====================================================
   LIGHTBOX
===================================================== */

function abrirMidia(midia) {

    midiaAtual =
    midia;


    lightbox.classList.add("ativo");


    document.body.style.overflow =
    "hidden";


    if (midia.tipo === "foto") {

        videoGrande.pause();

        videoGrande.removeAttribute("src");

        videoGrande.style.display =
        "none";


        fotoGrande.style.display =
        "block";


        fotoGrande.src =
        "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(midia.id) +
        "&sz=w2000";


        return;

    }


    fotoGrande.style.display =
    "none";


    fotoGrande.removeAttribute("src");


    videoGrande.style.display =
    "block";


    videoGrande.src =
    "https://drive.google.com/uc?export=view&id=" +
    encodeURIComponent(midia.id);


    videoGrande.load();

}


/* =====================================================
   FECHAR
===================================================== */

function fecharFoto() {

    lightbox.classList.remove("ativo");


    videoGrande.pause();

    videoGrande.removeAttribute("src");

    fotoGrande.removeAttribute("src");


    videoGrande.style.display =
    "none";


    fotoGrande.style.display =
    "block";


    midiaAtual =
    null;


    document.body.style.overflow =
    "";

}


fechar.onclick =
fecharFoto;


lightbox.onclick =
function(event) {

    if (event.target === lightbox)
        fecharFoto();

};


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape")
            fecharFoto();

    }
);


/* =====================================================
   BAIXAR
===================================================== */

baixar.onclick =
function() {

    if (!midiaAtual)
        return;


    const url =
    "https://drive.google.com/uc?export=download&id=" +
    encodeURIComponent(midiaAtual.id);


    window.open(
        url,
        "_blank"
    );

};


/* =====================================================
   COMPARTILHAR
===================================================== */

compartilhar.onclick =
async function() {

    if (!midiaAtual)
        return;


    const url =
    "https://drive.google.com/uc?export=view&id=" +
    encodeURIComponent(midiaAtual.id);


    if (navigator.share) {

        try {

            await navigator.share({

                title:
                midiaAtual.tipo === "video"
                ? "Um recado especial ❤️"
                : "Uma memória especial ❤️",

                text:
                midiaAtual.tipo === "video"
                ? "Confira esse recado!"
                : "Confira essa foto!",

                url: url

            });

        } catch(e) {}

        return;

    }


    try {

        await navigator.clipboard.writeText(url);


        const original =
        compartilhar.innerHTML;


        compartilhar.innerHTML =
        "✓ &nbsp; LINK COPIADO";


        setTimeout(
            () => {

                compartilhar.innerHTML =
                original;

            },
            2000
        );

    } catch(e) {

        window.open(
            url,
            "_blank"
        );

    }

};


/* =====================================================
   ABAS
===================================================== */

filtros.forEach(
    function(botao) {

        botao.onclick =
        function() {

            filtros.forEach(
                item =>
                item.classList.remove("ativo")
            );


            botao.classList.add("ativo");


            filtroAtual =
            botao.dataset.filtro;


            renderizarGaleria();

        };

    }
);


/* =====================================================
   ATUALIZAR
===================================================== */

atualizar.onclick =
function() {

    carregarFotos();

};


/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */

setInterval(
    carregarFotos,
    10000
);


/* =====================================================
   INÍCIO
===================================================== */

carregarEvento();

carregarFotos();

</script>
